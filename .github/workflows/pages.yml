name: 트렌드 수집 및 Pages 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 20 * * *"  # 매일 20:07 UTC = 시드니 아침 7:07 (서머타임 AEDT 기준, 4~10월엔 6:07)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 수집 및 정적 사이트 생성
        run: python3 collect.py _site
        env:
          PAGES_BASE: https://chaejinkim89-cmyk.github.io/daily-trend-viewer/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
